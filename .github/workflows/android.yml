name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    # 1. Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Install dependencies
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget tar openjdk-11-jdk

    # 3. Download and extract Android command-line tools
    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
        mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
        rm cmdline-tools.zip

    # 4. Add Android SDK tools to PATH
    - name: Update PATH
      run: |
        echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

    # 5. Accept SDK licenses
    - name: Accept licenses
      run: yes | sdkmanager --licenses

    # 6. Install essential SDK packages
    - name: Install SDK packages
      run: |
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    # 7. Make Gradle wrapper executable
    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    # 8. Build the APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # 9. Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
