name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64

    steps:
      # 1. Install essential tools
      - name: Install essential tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tar unzip wget curl openjdk-11-jdk git

      # 2. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. Download Android command line tools
      - name: Download Android SDK command line tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT
          # Move to correct folder structure (avoid latest/latest)
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest || true

      # 4. Update PATH for SDK tools
      - name: Update PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      # 5. Accept SDK licenses
      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      # 6. Make Gradle wrapper executable
      - name: Set Gradle wrapper permissions
        run: chmod +x ./gradlew

      # 7. Build the APK
      - name: Build APK
        run: ./gradlew assembleDebug

      # 8. Upload APK as artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

