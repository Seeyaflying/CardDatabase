name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3.7 python3.7-venv python3.7-dev \
                              build-essential git zip unzip openjdk-17-jdk \
                              zlib1g-dev libncurses5-dev libncursesw5-dev \
                              libffi-dev libssl-dev libsqlite3-dev \
                              wget curl xz-utils libbz2-dev

      - name: Install pip for Python 3.7
        run: |
          curl https://bootstrap.pypa.io/pip/3.7/get-pip.py -o get-pip.py
          python3.7 get-pip.py
          python3.7 -m pip install --upgrade pip setuptools wheel

      - name: Install Buildozer & Cython
        run: |
          python3.7 -m pip install --upgrade buildozer cython

      - name: Setup Android SDK & NDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          python3.7 -m buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug-apk
          path: bin/*.apk
