name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      PATH: ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin:${{ github.workspace }}/android-sdk/platform-tools:$JAVA_HOME/bin:$PATH

    steps:
    # Install tar first to avoid checkout errors
    - name: Install essential tools
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget curl git python3 python3-pip openjdk-17-jdk tar

    # Checkout repository
    - name: Checkout repository
      uses: actions/checkout@v4

    # Download and setup Android SDK command-line tools
    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip
        mv cmdline-tools latest
        rm cmdline-tools.zip
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    # Ensure Gradle wrapper is executable
    - name: Make Gradle Wrapper Executable
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew
        else
          echo "gradlew not found, ensure your project has it."
          exit 1
        fi

    # Build APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
