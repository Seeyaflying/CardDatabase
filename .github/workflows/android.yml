name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # Install dependencies
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip tar openjdk-17-jdk

      # Install Android SDK Command Line Tools
      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          yes | $ANDROID_SDK_ROOT/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-33"

      # Set Android environment variables
      - name: Set environment variables
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "${ANDROID_SDK_ROOT}/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH

      # Install Gradle
      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.3-bin.zip -O gradle.zip
          unzip gradle.zip
          export PATH=$PWD/gradle-8.3/bin:$PATH
          gradle -v

      # Build the APK
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
