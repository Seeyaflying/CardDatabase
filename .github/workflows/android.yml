name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    # 1️⃣ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Set up Java (required for Gradle)
    - name: Set up Java 11
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 11

    # 3️⃣ Download Android Command Line Tools
    - name: Download Android command-line tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
        mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

    # 4️⃣ Add SDK tools to PATH
    - name: Add SDK tools to PATH
      run: echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

    # 5️⃣ Install required Android SDK packages
    - name: Install SDK packages
      run: |
        yes | sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    # 6️⃣ Make Gradle wrapper executable
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # 7️⃣ Build APK
    - name: Build APK
      run: ./gradlew assembleDebug

    # 8️⃣ Upload APK as artifact
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
