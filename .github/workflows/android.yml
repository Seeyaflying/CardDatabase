name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
      PATH: ${{ github.workspace }}/android-sdk/cmdline-tools/latest/bin:${{ github.workspace }}/android-sdk/platform-tools:$PATH

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Install required system packages
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3.7 python3.7-venv python3.7-dev \
          openjdk-11-jdk \
          unzip curl git build-essential \
          libncurses5 libncurses5-dev zlib1g-dev \
          libssl-dev libffi-dev pkg-config \
          wget xz-utils

    # Install pip for Python 3.7
    - name: Install pip for Python 3.7
      run: |
        curl -O https://bootstrap.pypa.io/pip/3.7/get-pip.py
        sudo python3.7 get-pip.py

    # Upgrade pip, setuptools, wheel
    - name: Upgrade pip and tools
      run: |
        sudo python3.7 -m pip install --upgrade pip setuptools wheel

    # Create a Python virtual environment
    - name: Create venv
      run: python3.7 -m venv venv
    - name: Activate venv
      run: echo "source $PWD/venv/bin/activate" >> $GITHUB_ENV

    # Install Buildozer
    - name: Install Buildozer
      run: |
        source venv/bin/activate
        pip install --upgrade buildozer cython

    # Install Android SDK and NDK
    - name: Download Android SDK Command Line Tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        curl -o sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip sdk-tools.zip
        rm sdk-tools.zip
        mv cmdline-tools latest

    - name: Accept Android licenses
      run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install required SDK packages
      run: |
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"

    # Build APK
    - name: Build APK
      run: |
        source venv/bin/activate
        buildozer android debug
