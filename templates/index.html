<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Card Sorter Pro</title>
    <style>
        :root { --bg: #121212; --text: #e0e0e0; --primary: #bb86fc; --yes: #4caf50; --no: #cf6679; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--text); font-family: sans-serif; user-select: none; }
        body { display: flex; flex-direction: column; }

        #status-bar { height: 40px; background: #000; display: flex; justify-content: space-around; align-items: center; font-size: 0.8rem; border-bottom: 1px solid #222; flex-shrink: 0; }

        /* New File Info Bar */
        #file-info {
            height: 30px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--primary);
            border-bottom: 1px solid #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 10px;
        }

        #stage { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #111; overflow: hidden; }
        #current-card { max-width: 92%; max-height: 92%; object-fit: contain; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); touch-action: none; will-change: transform; pointer-events: auto; }
        #wait-msg { position: absolute; text-align: center; background: rgba(0,0,0,0.9); padding: 25px; border-radius: 12px; z-index: 10; display: none; border: 1px solid var(--primary); }

        #controls { height: 145px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 12px; background: #1a1a1a; border-top: 1px solid #333; flex-shrink: 0; }
        button { border: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-weight: bold; cursor: pointer; }
        #btn-no { background-color: var(--no); } #btn-undo { background-color: #333; } #btn-yes { background-color: var(--yes); }
        #btn-sync { grid-column: span 3; background-color: var(--primary); color: #000; height: 48px; font-size: 0.9rem; }
        .label { font-size: 0.65rem; margin-top: 5px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="status-bar">
        <span>INBOX: <b id="stat-inbox">0</b></span>
        <span>SET: <b id="stat-folder">...</b></span>
        <span>DONE: <b id="stat-total">0</b></span>
    </div>

    <div id="file-info">Ready to sort...</div>

    <div id="stage">
        <div id="wait-msg">
            <p>Inbox Empty.<br>Check PC Terminal or Sync.</p>
        </div>
        <img id="current-card" src="" style="display:none;">
    </div>
    <div id="controls">
        <button id="btn-no"><span>✖</span><span class="label">NO</span></button>
        <button id="btn-undo"><span>⟲</span><span class="label">UNDO</span></button>
        <button id="btn-yes"><span>✔</span><span class="label">YES</span></button>
        <button id="btn-sync">SYNC TO GOOGLE DRIVE</button>
    </div>

    <script>
        let currentPath = "";
        let startX = 0;
        let isDragging = false;
        const img = document.getElementById('current-card');
        const fileInfo = document.getElementById('file-info');

        async function updateStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('stat-inbox').innerText = data.inbox;
                document.getElementById('stat-total').innerText = data.total;
                document.getElementById('stat-folder').innerText = data.folder;
                document.getElementById('wait-msg').style.display = (data.waiting && data.inbox === 0) ? 'block' : 'none';
            } catch(e){}
        }

        async function loadNext() {
            const res = await fetch('/api/next');
            const data = await res.json();
            if (data.url) {
                img.src = data.url + "?t=" + Date.now();
                fileInfo.innerText = data.display_name || data.path; // Show the name/path
                img.style.display = 'block';
                img.style.transition = "none";
                img.style.transform = "translateX(0) rotate(0deg)";
                img.style.opacity = "1";
                currentPath = data.path;
            } else {
                img.style.display = 'none';
                fileInfo.innerText = "No cards remaining in inbox.";
                updateStats();
            }
        }

        async function handleDecision(choice) {
            if (!currentPath) return;
            img.style.transition = "transform 0.3s ease-in, opacity 0.3s";
            img.style.transform = choice === 'yes' ? "translateX(500px) rotate(25deg)" : "translateX(-500px) rotate(-25deg)";
            img.style.opacity = "0";

            await fetch('/api/decision', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({path: currentPath, decision: choice})
            });

            setTimeout(loadNext, 250);
            updateStats();
        }

        // Swipe Logic
        img.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isDragging = true; img.style.transition = "none"; }, {passive: false});
        img.addEventListener('touchmove', (e) => {
            if (!isDragging) return; e.preventDefault();
            let diff = e.touches[0].clientX - startX;
            img.style.transform = `translateX(${diff}px) rotate(${diff / 15}deg)`;
        }, {passive: false});
        img.addEventListener('touchend', (e) => {
            if (!isDragging) return; isDragging = false;
            let diff = e.changedTouches[0].clientX - startX;
            if (Math.abs(diff) > 100) handleDecision(diff > 0 ? 'yes' : 'no');
            else { img.style.transition = "transform 0.2s ease-out"; img.style.transform = "translateX(0) rotate(0deg)"; }
        });

        document.getElementById('btn-yes').onclick = () => handleDecision('yes');
        document.getElementById('btn-no').onclick = () => handleDecision('no');
        document.getElementById('btn-undo').onclick = async () => {
            const res = await fetch('/api/undo', {method: 'POST'});
            if (res.ok) { loadNext(); updateStats(); }
        };
        document.getElementById('btn-sync').onclick = async () => {
            const btn = document.getElementById('btn-sync'); btn.innerText = "SYNCING...";
            await fetch('/api/sync_to_drive', {method: 'POST'});
            btn.innerText = "SYNC TO GOOGLE DRIVE"; updateStats(); loadNext();
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') handleDecision('yes');
            if (e.key === 'ArrowLeft') handleDecision('no');
            if (e.ctrlKey && e.key === 'z') document.getElementById('btn-undo').click();
        });

        setInterval(updateStats, 5000);
        updateStats(); loadNext();
    </script>
</body>
</html>
